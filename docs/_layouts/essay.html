---
layout: default
---
<article class="essay">
  <header class="essay-header">
    <pre>{{ preview_image | inspect }}</pre>
    {% if preview_image and preview_image != blank %}
    <img src="{{ preview_image | relative_url }}" alt="Preview image for {{ page.title }}" class="essay-preview-image" />
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.generated_at %}<p class="meta">Generated {{ page.generated_at }}</p>{% endif %}
    <p class="actions">
      <a href="{{ page.epub_download | relative_url }}">Download EPUB</a>
    </p>
  </header>
  <section class="essay-content">{{ content }}</section>
</article>
